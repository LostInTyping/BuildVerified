name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Review PR with Claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            EVENT: ${{ github.event.action }}
            BEFORE SHA: ${{ github.event.before }}
            AFTER SHA: ${{ github.event.after }}

            ## Step 1: Check for prior reviews

            Run `gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments` to fetch your previous inline review comments on this PR. Note which files and lines you already commented on.

            Also run `gh pr view ${{ github.event.pull_request.number }} --comments` to see any top-level discussion, including author replies explaining why something is intentional.

            ## Step 2: Determine review scope

            If EVENT is "synchronize" (new push to existing PR):
            - Focus on changes introduced since the last review: `git diff $BEFORE_SHA..$AFTER_SHA`
            - For unchanged code you already commented on, do NOT re-flag it
            - If the author replied to a previous comment with a justification, respect that decision

            If EVENT is "opened" (new PR):
            - Review the full PR diff: `gh pr diff $PR_NUMBER`

            ## Step 3: Review

            Focus on:
            - Type safety and TypeScript strictness (no `any`)
            - Next.js best practices (server components by default, static generation)
            - Tailwind CSS consistency with existing theme tokens
            - Accessibility concerns
            - Code quality and maintainability
            - Whether changes match existing patterns in the codebase

            Be direct and concise. Flag real issues, skip nitpicks.

            Use `gh pr comment` for top-level feedback.
            Use `mcp__github_inline_comment__create_inline_comment` to highlight specific code issues.
            Only post GitHub comments - don't submit review text as messages.
          claude_args: |
            --model claude-opus-4-6
            --max-turns 15
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api:*),Read,Glob,Grep"
